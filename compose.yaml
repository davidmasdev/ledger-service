services:
  postgres:
    image: 'postgres:17'
    environment:
      - 'POSTGRES_DB=ledger'
      - 'POSTGRES_PASSWORD=ledger'
      - 'POSTGRES_USER=ledger'
    ports:
      - '5432'
  kafka:
    # Single-node KRaft broker; its default listener advertises localhost:9092, matching application.yml.
    image: 'apache/kafka:4.1.0'
    ports:
      - '9092:9092'
