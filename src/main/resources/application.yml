spring:
  application:
    name: ledger-service
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  kafka:
    # Spring Boot's Docker Compose support has no Kafka connection details, so compose.yaml publishes a fixed port.
    # Tests override this through @ServiceConnection on the Testcontainers KafkaContainer.
    bootstrap-servers: localhost:9092
    producer:
      # Wait for all in-sync replicas, and let the producer deduplicate its own retries.
      acks: all
      properties:
        enable.idempotence: true

springdoc:
  # Swagger UI at /swagger-ui.html, OpenAPI JSON at /v3/api-docs. Success bodies are JSON (the default is */*).
  default-produces-media-type: application/json

ledger:
  outbox:
    topic: ledger.journal-entries
    batch-size: 100
    send-timeout: 10s
    relay:
      enabled: true
      poll-interval: 500ms
